[package]
name = "noiro-engine"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"
description = "Noiro JSON-RPC v1 daemon around the pinned Stremio core snapshot"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stremiox-core = { path = "../stremiox-core" }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
