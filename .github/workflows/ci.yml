name: Noiro Kodi CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-packaging:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_addons.py
      - run: python scripts/build_repository.py --version "$(cat VERSION)"
      - run: python scripts/verify_release.py

  armhf-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build_native.sh
      - run: file addons/script.service.noiro/resources/bin/linux-armhf/noiro-engine | grep -E 'ELF 32-bit.*ARM'
      - run: python3 scripts/build_repository.py --version "$(cat VERSION)" --require-native
      - run: python3 scripts/verify_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: complete-kodi-packages
          path: artifacts/
