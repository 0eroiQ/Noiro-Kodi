name: Signed public release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.3.3
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify release tag matches VERSION
        run: test "${{ inputs.tag }}" = "v$(cat VERSION)"
      - run: sh scripts/build_native.sh
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/validate_addons.py
      - run: python3 scripts/build_repository.py --version "$(cat VERSION)" --require-native
      - name: Import signing key
        env:
          NOIRO_RELEASE_PRIVATE_KEY: ${{ secrets.NOIRO_RELEASE_PRIVATE_KEY }}
        run: |
          test -n "$NOIRO_RELEASE_PRIVATE_KEY"
          install -m 0600 /dev/null /tmp/noiro-release-private.pem
          printf '%s' "$NOIRO_RELEASE_PRIVATE_KEY" > /tmp/noiro-release-private.pem
          python3 scripts/sign_release.py --private-key /tmp/noiro-release-private.pem
      - run: python3 scripts/verify_release.py --require-signature
      - name: Create signed repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ inputs.tag }}"
          artifacts/*.zip artifacts/addons.xml artifacts/addons.xml.sha256
          artifacts/release-manifest.json artifacts/release-manifest.sig artifacts/SHA256SUMS
          --repo "${{ github.repository }}"
          --title "Noiro Kodi ${{ inputs.tag }}"
          --notes "Signed Noiro Kodi release for Kodi 21 on Vero 4K+."
      - name: Publish Kodi bootstrap repository tree
        run: |
          publish_root="$(mktemp -d)"
          publish_dir="$publish_root/tree"
          if git ls-remote --exit-code --heads origin kodi-repository; then
            git fetch origin kodi-repository
            git worktree add -B kodi-repository "$publish_dir" origin/kodi-repository
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan kodi-repository
            git -C "$publish_dir" rm -rf . || true
          fi
          python3 scripts/build_kodi_repository_tree.py --artifacts artifacts --output "$publish_dir"
          git -C "$publish_dir" config user.name "github-actions[bot]"
          git -C "$publish_dir" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$publish_dir" add addons.xml addons.xml.sha256 repository.noiro
          if ! git -C "$publish_dir" diff --cached --quiet; then
            git -C "$publish_dir" commit -m "release: publish ${{ inputs.tag }} Kodi repository"
          fi
          git -C "$publish_dir" push origin HEAD:kodi-repository
